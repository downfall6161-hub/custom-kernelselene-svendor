name: Build Selene Kernel (KernelSU + SUSFS)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            libssl-dev bc gcc-aarch64-linux-gnu cpio python3 python3-pip \
            device-tree-compiler libncurses5 libncurses5-dev openssl \
            libelf-dev dwarves ccache

      - name: Clone kernel source (selene)
        run: |
          git clone --depth=1 https://github.com/techyminati/selene kernel
          cd kernel
          echo "Kernel source cloned successfully"
          ls -la

      - name: Integrate KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/mlm-games/KernelSU-Non-GKI/main/kernel/setup-subm.sh" | bash -s
          if [ -d "KernelSU" ]; then
            echo "✅ KernelSU directory created"
            ls KernelSU/
          fi
          # Integrate into defconfig (non-GKI method)
          if [ -f "KernelSU/scripts/integrate-no-kprobe.py" ]; then
            python3 KernelSU/scripts/integrate-no-kprobe.py arch/arm64/configs/selene_defconfig
          else
            echo "CONFIG_KPROBES=y" >> arch/arm64/configs/selene_defconfig
            echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/selene_defconfig
            echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/selene_defconfig
          fi
          echo "✅ KernelSU-Next integrated"

      - name: Integrate SUSFS (Root Hiding)
        run: |
          cd kernel
          git clone https://gitlab.com/simonpunk/susfs4ksu susfs4ksu || echo "SUSFS clone failed, trying alternative..."
          if [ -d "susfs4ksu" ]; then
            if [ -f "susfs4ksu/setup.sh" ]; then
              chmod +x susfs4ksu/setup.sh
              ./susfs4ksu/setup.sh . || echo "SUSFS setup script failed, applying manually..."
            fi
            # Manual SUSFS config entries
            echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/selene_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/selene_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/selene_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/selene_defconfig
            echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> arch/arm64/configs/selene_defconfig
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> arch/arm64/configs/selene_defconfig
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/selene_defconfig
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> arch/arm64/configs/selene_defconfig
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> arch/arm64/configs/selene_defconfig
            echo "✅ SUSFS config added"
          else
            echo "⚠️ SUSFS not available, building without it"
          fi

      - name: Show final defconfig
        run: |
          cd kernel
          echo "=== KernelSU + SUSFS config entries ==="
          grep -E "CONFIG_K(SU|PROBES)|CONFIG_HAVE_KPROBES|CONFIG_KPROBE" arch/arm64/configs/selene_defconfig || true
          grep -E "CONFIG_KSU_SUSFS" arch/arm64/configs/selene_defconfig || true

      - name: Set up environment and compile
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=/usr/bin/aarch64-linux-gnu-
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          ccache -M 5G

          echo "🔧 Generating defconfig..."
          make O=out selene_defconfig

          echo "🔨 Starting kernel compilation..."
          make O=out -j$(nproc --all) 2>&1 | tail -50

          echo "=== Build result ==="
          if [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "✅ Image.gz built successfully!"
            ls -lh out/arch/arm64/boot/Image.gz
          elif [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "✅ Image.gz-dtb built successfully!"
            ls -lh out/arch/arm64/boot/Image.gz-dtb
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            echo "✅ Image built successfully!"
            ls -lh out/arch/arm64/boot/Image
          else
            echo "❌ Kernel image not found, checking build errors..."
            find out/arch/arm64/boot/ -type f 2>/dev/null || echo "No boot files found"
          fi

      - name: Create AnyKernel3 flashable ZIP
        run: |
          cd kernel

          # Clone AnyKernel3 template
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel
          cd anykernel

          # Clean example files
          rm -rf .git .github modules patch ramdisk LICENSE README.md

          # Configure for Redmi 10 Prime (selene)
          cat > anykernel.sh << 'ANYKERNEL'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers
          properties() { '
          kernel.string=KernelSU-SUSFS Kernel for Redmi 10 Prime (selene)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=selene
          device.name2=selene_global
          device.name3=Redmi 10 Prime
          supported.versions=12-14
          supported.patchlevels=
          '; }

          # Shell variables
          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          set_perm_recursive 0 0 755 644 $ramdisk/*;
          dump_boot;

          write_boot;
          ANYKERNEL

          # Copy kernel image
          if [ -f "../out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp ../out/arch/arm64/boot/Image.gz-dtb ./
          elif [ -f "../out/arch/arm64/boot/Image.gz" ]; then
            cp ../out/arch/arm64/boot/Image.gz ./
          elif [ -f "../out/arch/arm64/boot/Image" ]; then
            cp ../out/arch/arm64/boot/Image ./
          fi

          # Copy DTB if exists
          find ../out/arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} ./ \; 2>/dev/null || true

          # Create flashable ZIP
          zip -r9 ../KernelSU-SUSFS-selene-$(date +%Y%m%d).zip . -x '*.git*'
          echo "✅ Flashable ZIP created!"
          ls -lh ../KernelSU-SUSFS-selene-*.zip

      - name: Upload kernel ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-SUSFS-selene-kernel
          path: kernel/KernelSU-SUSFS-selene-*.zip
          retention-days: 30

      - name: Upload kernel image (backup)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-raw
          path: |
            kernel/out/arch/arm64/boot/Image*
          retention-days: 30
          if-no-files-found: ignore

      - name: Build summary
        run: |
          echo "============================================"
          echo "  🔥 Selene Kernel Build Complete! 🔥"
          echo "============================================"
          echo ""
          echo "Device: Redmi 10 Prime (selene)"
          echo "Features: KernelSU-Next + SUSFS"
          echo "Date: $(date)"
          echo ""
          echo "Download the flashable ZIP from Artifacts tab above"
          echo "Flash via TWRP or ADB sideload"
          echo "============================================"
